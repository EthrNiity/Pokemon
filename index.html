<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holo Cote</title>
<meta name="description" content="Classeur de cartes Pokémon : scan, centrage, collection, ventes et cotes Cardmarket.">
<meta name="theme-color" content="#f7f4fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131022" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --fond:#f7f4fc; --papier:#ffffff; --papier2:#f1ecf9; --encre:#1e1938; --doux:#6d6789; --trait:#e3dcf0;
  --accent:#ff5a4f; --accent-encre:#ffffff; --bleu:#3b78ff; --or:#f5b524; --vert:#16a874; --rouge:#e5484d;
  --fr:#3b78ff; --en:#e5484d; --ja:#8b5cf6;
  --holo:linear-gradient(115deg,#ff9a9e 0%,#fecfef 18%,#a1c4fd 38%,#c2e9fb 52%,#d4fc79 70%,#fbc2eb 88%,#ff9a9e 100%);
  --ombre:0 1px 2px rgb(30 25 56/.06),0 6px 22px -8px rgb(30 25 56/.18);
  --r:18px; --r-s:12px;
  --f-titre:"Fredoka",system-ui,sans-serif; --f-texte:"Nunito",system-ui,sans-serif; --f-chiffre:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fond:#131022; --papier:#1d1933; --papier2:#262143; --encre:#f3effd; --doux:#a39dc2; --trait:#312b52;
  --ombre:0 1px 2px rgb(0 0 0/.3),0 8px 26px -10px rgb(0 0 0/.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --fond:#131022; --papier:#1d1933; --papier2:#262143; --encre:#f3effd; --doux:#a39dc2; --trait:#312b52;
  --ombre:0 1px 2px rgb(0 0 0/.3),0 8px 26px -10px rgb(0 0 0/.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fond);color:var(--encre);font:16px/1.45 var(--f-texte);-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(1200px 500px at 110% -10%,color-mix(in srgb,var(--bleu) 10%,transparent),transparent 60%),radial-gradient(900px 420px at -20% 0%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 60%);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--bleu)}
h1,h2,h3{font-family:var(--f-titre);font-weight:600;margin:0;letter-spacing:.005em}
.chiffre{font-family:var(--f-chiffre);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ───── Structure ───── */
.app{max-width:1120px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
.tete{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.marque{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.marque .logo{width:36px;height:36px;border-radius:11px;background:var(--holo);background-size:200% 200%;animation:moire 8s ease-in-out infinite;display:grid;place-items:center;box-shadow:var(--ombre)}
.marque .logo svg{width:22px;height:22px}
.marque b{font-family:var(--f-titre);font-size:22px;font-weight:700;letter-spacing:.01em}
@keyframes moire{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.tete-actions{display:flex;gap:6px;align-items:center}
.icone-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--trait);background:var(--papier);display:grid;place-items:center;color:var(--doux)}
.icone-btn:hover{color:var(--encre)}
.icone-btn svg{width:20px;height:20px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;align-items:flex-end;padding:6px 8px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--papier) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--trait)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--doux);text-decoration:none;font-size:11.5px;font-weight:700;border-radius:12px}
.nav a svg{width:23px;height:23px}
.nav a[aria-current="page"]{color:var(--encre)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.nav a.scan-bouton{flex:0 0 auto;margin-top:-22px}
.nav a.scan-bouton span.rond{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-encre);box-shadow:0 8px 20px -6px color-mix(in srgb,var(--accent) 70%,transparent),inset 0 0 0 4px rgb(255 255 255/.18)}
.nav a.scan-bouton span.rond svg{width:28px;height:28px;color:inherit}
@media (min-width:900px){
  .app{padding-bottom:40px}
  .nav{position:sticky;top:0;bottom:auto;margin:0 auto 18px;max-width:1120px;border:1px solid var(--trait);border-radius:16px;justify-content:center;gap:4px;padding:6px;align-items:center;box-shadow:var(--ombre)}
  .nav a{flex:0 0 auto;flex-direction:row;gap:8px;font-size:14.5px;padding:9px 16px}
  .nav a[aria-current="page"]{background:var(--papier2)}
  .nav a.scan-bouton{margin:0}
  .nav a.scan-bouton span.rond{width:auto;height:auto;border-radius:12px;padding:8px 14px;gap:8px;display:flex;box-shadow:none}
  .nav a.scan-bouton span.rond svg{width:20px;height:20px}
  .nav a.scan-bouton .lbl-scan{display:inline}
}
.lbl-scan{display:none}

/* ───── Éléments ───── */
.carte-ui{background:var(--papier);border:1px solid var(--trait);border-radius:var(--r);box-shadow:var(--ombre);padding:16px}
.grille{display:grid;gap:14px}
@media (min-width:900px){.grille.deux{grid-template-columns:1.25fr 1fr}}
.titre-section{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.titre-section h2{font-size:21px}
.titre-section h2{min-width:0}
.titre-section .petit{color:var(--doux);font-size:13.5px;white-space:nowrap}
.titre-section .btn{white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:13px;border:1px solid var(--trait);background:var(--papier);padding:10px 15px;font-weight:700;font-size:15px;text-decoration:none;color:var(--encre)}
.btn svg{width:18px;height:18px}
.btn.principal{background:var(--accent);border-color:transparent;color:var(--accent-encre);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn.bleu{background:var(--bleu);border-color:transparent;color:#fff}
.btn.danger{color:var(--rouge)}
.btn.discret{background:transparent}
.btn:disabled{opacity:.55;cursor:default}
.btn.plein{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.puce{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--papier2);color:var(--doux);white-space:nowrap}
.puce.fr{background:color-mix(in srgb,var(--fr) 14%,transparent);color:var(--fr)}
.puce.en{background:color-mix(in srgb,var(--en) 14%,transparent);color:var(--en)}
.puce.ja{background:color-mix(in srgb,var(--ja) 16%,transparent);color:var(--ja)}
.puce.gradee{background:var(--holo);color:#2a2346}
.puce.vert{background:color-mix(in srgb,var(--vert) 15%,transparent);color:var(--vert)}
.hausse{color:var(--vert)} .baisse{color:var(--rouge)}
.vide{padding:28px 16px;text-align:center;color:var(--doux)}
.vide svg{width:46px;height:46px;opacity:.6;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--trait);background:var(--papier);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--doux)}
.chip[aria-pressed="true"]{background:var(--encre);color:var(--fond);border-color:var(--encre)}
.champ{display:flex;flex-direction:column;gap:5px}
.champ>span{font-size:13px;font-weight:800;color:var(--doux)}
.champ input,.champ select,.champ textarea{width:100%;border:1px solid var(--trait);background:var(--papier);border-radius:12px;padding:11px 12px;font-size:16px;min-height:46px}
.champ textarea{min-height:76px;resize:vertical}
.champ input:focus,.champ select:focus,.champ textarea:focus,.recherche input:focus{outline:2px solid color-mix(in srgb,var(--bleu) 55%,transparent);outline-offset:1px}
.champs{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.champs .large{grid-column:1/-1}
.choix-photo{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:600;color:var(--doux)}
.choix-photo input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.segment{display:flex;background:var(--papier2);border-radius:13px;padding:4px;gap:4px}
.segment button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 8px;font-weight:800;color:var(--doux);font-size:14.5px}
.segment button[aria-pressed="true"]{background:var(--papier);color:var(--encre);box-shadow:var(--ombre)}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--encre);color:var(--fond);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14.5px;z-index:90;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.ok{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){.toast{bottom:28px}}
.chargement{display:inline-block;width:18px;height:18px;border-radius:50%;border:2.5px solid var(--trait);border-top-color:var(--accent);animation:tour .8s linear infinite;vertical-align:-3px}
@keyframes tour{to{transform:rotate(360deg)}}
.squelette{background:linear-gradient(90deg,var(--papier2),var(--trait),var(--papier2));background-size:200% 100%;animation:moire 1.4s linear infinite;border-radius:10px}

/* ───── Connexion ───── */
.connexion{max-width:420px;margin:7vh auto 0;display:grid;gap:16px}
.connexion .accroche{text-align:center}
.connexion .accroche .logo{width:76px;height:76px;margin:0 auto 12px;border-radius:24px;background:var(--holo);background-size:200% 200%;animation:moire 8s ease-in-out infinite;display:grid;place-items:center;box-shadow:var(--ombre)}
.connexion .accroche .logo svg{width:44px;height:44px}
.connexion h1{font-size:32px}
.connexion p{color:var(--doux);margin:6px 0 0}

/* ───── Récap ───── */
.valeur-tete{position:relative;overflow:hidden;padding:20px}
.valeur-tete::before{content:"";position:absolute;inset:-40% -10% auto auto;width:70%;height:180%;background:var(--holo);opacity:.18;filter:blur(18px);transform:rotate(18deg);pointer-events:none}
.valeur-tete .label{font-size:13.5px;font-weight:800;color:var(--doux);text-transform:uppercase;letter-spacing:.06em}
.valeur-tete .total{font-family:var(--f-titre);font-size:44px;font-weight:700;line-height:1.05;margin:4px 0 2px}
.valeur-tete .delta{font-weight:800;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px;position:relative}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--papier2);border-radius:14px;padding:10px 12px}
.kpi span{display:block;font-size:12px;font-weight:800;color:var(--doux)}
.kpi b{font-family:var(--f-chiffre);font-size:17px}
.kpi small{display:block}
.periodes{display:flex;gap:4px}
.periodes button{border:0;background:transparent;color:var(--doux);font-weight:800;font-size:13px;padding:5px 9px;border-radius:9px}
.periodes button[aria-pressed="true"]{background:var(--papier2);color:var(--encre)}
.courbe{position:relative;width:100%;height:210px;margin-top:8px;touch-action:pan-y}
.courbe svg{width:100%;height:100%;display:block;overflow:visible}
.courbe .bulle{position:absolute;top:0;transform:translateX(-50%);background:var(--encre);color:var(--fond);font-size:12.5px;font-weight:700;padding:5px 8px;border-radius:9px;pointer-events:none;white-space:nowrap}
.courbe .bulle small{display:block;font-weight:600;opacity:.75;font-size:11px}
.legende{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--doux);margin-top:6px}
.legende i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legende i.pointille{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important;height:2px}
.barres{display:grid;gap:9px}
.barre-l{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;font-size:14px}
.barre-l .piste{height:10px;border-radius:6px;background:var(--papier2);overflow:hidden}
.barre-l .piste i{display:block;height:100%;border-radius:6px}

/* ───── Listes de cartes ───── */
.liste{display:grid;gap:8px}
.ligne{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px 8px 8px;background:var(--papier);border:1px solid var(--trait);border-radius:15px;text-align:left;width:100%;color:inherit}
.ligne:hover{border-color:color-mix(in srgb,var(--bleu) 45%,var(--trait))}
.vignette{position:relative;width:52px;aspect-ratio:63/88;border-radius:5px;background:var(--papier2);box-shadow:0 1px 3px rgb(0 0 0/.18);overflow:hidden;flex:none}
.vignette>img,.tuile .img>img,.fiche .grande>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
.ligne .nom{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne .meta{font-size:13px;color:var(--doux);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center;margin-top:2px}
.ligne .droite{text-align:right}
.ligne .droite b{font-family:var(--f-chiffre);font-size:15.5px;display:block}
.ligne .droite small{font-size:12px;color:var(--doux)}
.galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
@media (min-width:700px){.galerie{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
.tuile{border:0;background:transparent;padding:0;text-align:left;color:inherit;display:flex;flex-direction:column;gap:6px}
.tuile .img{position:relative;aspect-ratio:63/88;border-radius:9px;overflow:hidden;background:var(--papier2);box-shadow:0 2px 8px -2px rgb(0 0 0/.25);transition:transform .2s}
.tuile:hover .img{transform:translateY(-3px) rotate(-.6deg)}
.tuile .img img{width:100%;height:100%;object-fit:cover;display:block}
/* Visuel neutre quand aucune image n'existe */
.sans{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12%;text-align:center;
  background:linear-gradient(var(--papier),var(--papier)) padding-box,var(--holo) border-box;border:5px solid transparent;border-radius:inherit;color:var(--doux)}
.sans.petit{border-width:2px;padding:0}
.visuel-autre{position:absolute;z-index:2;right:6px;bottom:6px;background:rgb(20 16 40/.72);color:#fff;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.02em}
.sans.petit svg{width:58%;height:58%;opacity:.55}
.sans-nom{font-family:var(--f-titre);font-weight:600;font-size:16px;line-height:1.15;color:var(--encre)}
.sans-meta{font-size:12px;line-height:1.25}
.sans-note{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.7;margin-top:4px}
.fiche .grande .sans-nom{font-size:24px}.fiche .grande .sans-meta{font-size:14px}
.tuile .img .marques{position:absolute;left:6px;top:6px;display:flex;gap:4px;z-index:2}
.tuile .img .marques .puce{background:var(--papier);box-shadow:0 1px 4px rgb(0 0 0/.25)}
.tuile .img .possede{position:absolute;z-index:2;right:6px;top:6px;background:var(--vert);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:2px 7px}
.tuile .t-nom{font-weight:800;font-size:14.5px;line-height:1.2}
.tuile .t-fr{font-size:12.5px;font-weight:700;color:var(--bleu);line-height:1.2}
.tuile .t-meta{font-size:12.5px;color:var(--doux);line-height:1.25}

/* ───── Recherche ───── */
.recherche{position:relative}
.recherche input{width:100%;border:1px solid var(--trait);background:var(--papier);border-radius:16px;padding:15px 48px 15px 48px;font-size:17px;box-shadow:var(--ombre)}
.recherche>svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:21px;height:21px;color:var(--doux)}
.recherche input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.recherche .effacer{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--doux);width:36px;height:36px;border-radius:10px}
.aide-recherche{font-size:13px;color:var(--doux);margin:8px 4px 0}
.aide-recherche code{font-family:var(--f-chiffre);font-size:12px;background:var(--papier2);padding:1px 5px;border-radius:5px}
.etat-index{font-size:13px;color:var(--doux);display:flex;align-items:center;gap:8px;margin:10px 4px}

/* ───── Feuille (fiche, formulaires) ───── */
.voile{position:fixed;inset:0;z-index:50;background:rgb(10 8 22/.45);backdrop-filter:blur(3px);opacity:0;transition:opacity .2s}
.voile.ok{opacity:1}
.feuille{position:fixed;z-index:51;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;background:var(--fond);border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.feuille.ok{transform:none}
.feuille .poignee{width:44px;height:5px;border-radius:3px;background:var(--trait);margin:2px auto 10px}
.feuille .f-tete{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.feuille .f-tete h2{font-size:21px}
@media (min-width:800px){
  .feuille{left:50%;right:auto;bottom:auto;top:50%;width:min(860px,94vw);max-height:90vh;border-radius:24px;transform:translate(-50%,-46%) scale(.98);opacity:0;transition:.22s}
  .feuille.ok{transform:translate(-50%,-50%);opacity:1}
  .feuille .poignee{display:none}
}
.fiche{display:grid;gap:16px}
@media (min-width:800px){.fiche{grid-template-columns:300px 1fr;align-items:start}}
.fiche .grande{position:relative;aspect-ratio:63/88;border-radius:14px;overflow:hidden;background:var(--papier2);box-shadow:0 14px 30px -12px rgb(0 0 0/.5);max-width:min(240px,62vw);width:100%;margin:0 auto}
@media (min-width:800px){.fiche .grande{max-width:320px}}

.fiche .grande::after{content:"";position:absolute;inset:0;z-index:2;background:var(--holo);mix-blend-mode:color-dodge;opacity:0;transition:opacity .3s;background-size:250% 250%;pointer-events:none}
.fiche .grande:hover::after{opacity:.22;animation:moire 3s linear infinite}
.fiche h3{font-size:24px;line-height:1.15}
.fiche .sous{color:var(--doux);font-size:14.5px;margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cotes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
@media (min-width:520px){.cotes{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cote{background:var(--papier);border:1px solid var(--trait);border-radius:13px;padding:9px 11px}
.cote span{display:block;font-size:11.5px;font-weight:800;color:var(--doux)}
.cote b{font-family:var(--f-chiffre);font-size:16px}
.cote.grande-cote{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;background:var(--papier2);border:0}
.cote.grande-cote b{font-size:27px}
.source{font-size:12.5px;color:var(--doux);margin-top:8px}
.exemplaires{display:grid;gap:6px;margin-top:6px}

/* ───── Scan ───── */
.scan-zone{position:relative;background:#000;border-radius:20px;overflow:hidden;aspect-ratio:3/4;max-height:68vh;margin:0 auto;width:100%;max-width:520px}
.scan-zone video{width:100%;height:100%;object-fit:cover;display:block}
.scan-zone .guide{position:absolute;left:50%;top:46%;height:62%;aspect-ratio:63/88;transform:translate(-50%,-50%);border-radius:12px;box-shadow:0 0 0 9999px rgb(0 0 0/.42);outline:2px dashed rgb(255 255 255/.85);outline-offset:0;pointer-events:none}
.guide-aide{position:absolute;left:-30%;right:-30%;top:-34px;text-align:center;color:#fff;font-weight:700;font-size:13.5px;text-shadow:0 1px 3px rgb(0 0 0/.6)}
.anneau{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border:2.5px solid var(--or);border-radius:50%;pointer-events:none;opacity:0}
.anneau.ok{animation:point .9s ease-out}
@keyframes point{0%{transform:scale(1.5);opacity:0}25%{transform:scale(1);opacity:1}75%{opacity:1}100%{opacity:0}}
.zoom{position:absolute;left:14px;right:14px;top:12px;display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:13px;background:rgb(0 0 0/.45);border-radius:999px;padding:6px 12px}
.zoom input{flex:1;accent-color:var(--or)}
.obturateur.occupe{animation:tour 1s linear infinite;border-style:dashed}
.scan-natif{max-width:520px;margin:12px auto 0;text-align:center}
.scan-natif .source{margin:6px 0 0}
.alerte-flou{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--or) 18%,var(--papier));border:1px solid color-mix(in srgb,var(--or) 50%,var(--trait));font-weight:700;font-size:14.5px;margin-bottom:12px}
.scan-zone .coin{position:absolute;width:26px;height:26px;border:4px solid var(--or)}
.scan-zone .ctl{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;align-items:center;gap:22px}
.obturateur{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:var(--accent);box-shadow:0 0 0 3px rgb(0 0 0/.25)}
.scan-zone .ctl .icone-btn{background:rgb(0 0 0/.5);border-color:rgb(255 255 255/.25);color:#fff}
.editeur{position:relative;margin:0 auto;max-width:440px;width:100%;touch-action:none;user-select:none}

.loupe{position:absolute;width:118px;height:118px;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 18px rgb(0 0 0/.4);pointer-events:none;overflow:hidden;background:#000}
.loupe canvas{width:100%;height:100%;border-radius:0}
.mesures{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mesure{background:var(--papier);border:1px solid var(--trait);border-radius:14px;padding:10px 12px}
.mesure span{display:block;font-size:12px;font-weight:800;color:var(--doux)}

.controle .critere small{color:var(--doux);font-weight:600}
.niveaux{display:flex;flex-wrap:wrap;gap:6px}

.niveaux button[aria-pressed="true"]{border-color:var(--bleu);background:color-mix(in srgb,var(--bleu) 12%,var(--papier));color:var(--encre)}

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   Holo Cote : classeur de cartes Pokémon
   Données de cartes et cotes : TCGdex (cartes FR / EN / JA, cotes Cardmarket en €, mises à jour chaque jour).
   Stockage : Supabase, schéma « pokemon » (projet Séance musculation), relevé des cotes chaque nuit côté serveur.
   ═══════════════════════════════════════════════════════════════════════════ */
const SUPA_URL = "https://iqztehywqhwcvgskeosu.supabase.co";
const SUPA_CLE = "sb_publishable_ykcPtbs1MDlI2RjYK4WgVw_RfcHTB9a";
const TCGDEX = "https://api.tcgdex.net/v2";
const LANGUES = { fr: "Français", en: "Anglais", ja: "Japonais" };
const COURT = { fr: "FR", en: "EN", ja: "JP" };
const ETATS = { NM: "Near Mint", EX: "Excellent", GD: "Good", LP: "Light Played", PL: "Played", PO: "Poor" };
const ETATS_FR = { NM: "Quasi neuf", EX: "Excellent", GD: "Bon", LP: "Légèrement joué", PL: "Joué", PO: "Abîmé" };
const VARIANTES = { normal: "Normale", reverse: "Reverse", holo: "Holo", "premiere-edition": "1re édition", autre: "Autre" };
const GRADEURS = ["PSA", "PCA", "CGC", "BGS", "CCC", "Collect Aura", "SGC", "Autre"];
const PLATEFORMES = ["Cardmarket", "eBay", "Vinted", "Leboncoin", "En main propre", "Autre"];
const COEFS_DEFAUT = { NM: 1, EX: 0.8, GD: 0.65, LP: 0.5, PL: 0.35, PO: 0.2 };

const sb = supabase.createClient(SUPA_URL, SUPA_CLE, {
  db: { schema: "pokemon" },
  auth: { persistSession: true, autoRefreshToken: true, storageKey: "holo-cote-auth", detectSessionInUrl: true }
});

/* ───── Outils ───── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtEur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const fmtEur0 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const fmtUsd = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "USD" });
const eur = (v, rond) => v == null || isNaN(v) ? "—" : (rond && Math.abs(v) >= 1000 ? fmtEur0 : fmtEur).format(v);
const pct = v => v == null || !isFinite(v) ? "—" : (v > 0 ? "+" : "") + v.toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " %";
const signe = v => v > 0 ? "hausse" : v < 0 ? "baisse" : "";
const dateFr = d => d ? new Date(d + (String(d).length === 10 ? "T12:00:00" : "")).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }) : "";
const aujourdhui = () => new Date().toLocaleDateString("sv-SE");
const num = v => { if (v === "" || v == null) return null; const n = Number(String(v).replace(",", ".").replace(/\s/g, "")); return isFinite(n) ? n : null; };
const icone = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  etoile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  etoilePleine: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  lien: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  fermer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  cartes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="6" y="3" width="12" height="17" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h9"/></svg>',
  euro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 6.5A7 7 0 1 0 17 17.5M4 10h9M4 14h9"/></svg>',
  photo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>',
  lampe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>'
};
function toast(t, ms = 2600) { const e = $("#toast"); e.textContent = t; e.classList.add("ok"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("ok"), ms); }
function erreur(e, quoi) {
  console.error(quoi, e);
  const m = String(e?.message || e || "");
  if (/Invalid schema|PGRST106/.test(m)) return toast("Base pas encore prête : l’espace « pokemon » n’est pas exposé dans Supabase.", 5000);
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return toast("Pas de connexion internet pour le moment.", 4000);
  toast((quoi ? quoi + " : " : "") + m.slice(0, 140), 5000);
}


/* ───── Thème ───── */
(function () {
  try { const t = localStorage.getItem("holo-cote-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  $("#btn-theme").addEventListener("click", () => {
    const r = document.documentElement, sombre = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = sombre ? "light" : "dark";
    try { localStorage.setItem("holo-cote-theme", r.dataset.theme); } catch (e) {}
    if (ETAT.vue === "recap") rendre();
  });
})();

/* ═══════════ Cache local (IndexedDB) pour l'index des cartes ═══════════ */
const IDB = {
  db: null,
  ouvrir() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((ok, ko) => {
      const r = indexedDB.open("holo-cote", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => { this.db = r.result; ok(this.db); };
      r.onerror = () => ko(r.error);
    });
  },
  async lire(k) { try { const db = await this.ouvrir(); return await new Promise(ok => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); } catch (e) { return null; } },
  async ecrire(k, v) { try { const db = await this.ouvrir(); await new Promise(ok => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = ok; t.onerror = ok; }); } catch (e) {} }
};

/* ═══════════ TCGdex ═══════════ */
async function api(lang, chemin) {
  const r = await fetch(`${TCGDEX}/${lang}/${chemin}`);
  if (!r.ok) throw new Error(`TCGdex ${r.status}`);
  return r.json();
}

/* Index de toutes les cartes d'une langue (nom, numéro, set), gardé 5 jours sur l'appareil. */
const INDEX = { fr: null, en: null, ja: null };
const EN_COURS = {};
function norm(s) {
  return String(s || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").normalize("NFC").toLowerCase()
    .replace(/[’'`´]/g, "").replace(/[^\p{L}\p{N}\p{M}]+/gu, " ").trim();
}
/* ═══════════ Noms des Pokémon en français, anglais et japonais (PokeAPI, noms.json) ═══════════
   Sert à retrouver « Artikodin » parmi les cartes « Articuno » et « フリーザー », et l'inverse. */
const ESP = { pret: null, parNom: new Map(), noms: [], ja: new Map(), info: {} };
const normJa = s => norm(s).replace(/ /g, "");
function chargerEspeces() {
  return ESP.pret ||= fetch("noms.json").then(r => { if (!r.ok) throw new Error("noms.json " + r.status); return r.json(); }).then(d => {
    for (const [dex, fr, en, ja] of d.especes) {
      ESP.info[dex] = { fr, en, ja };
      for (const nm of [fr, en]) { const n = norm(nm); if (!n) continue; if (!ESP.parNom.has(n)) ESP.parNom.set(n, dex); ESP.noms.push([n, dex]); }
      if (ja) {
        const j = normJa(ja); if (!ESP.parNom.has(j)) ESP.parNom.set(j, dex); ESP.noms.push([j, dex]);
        if (!ESP.ja.has(j[0])) ESP.ja.set(j[0], []); ESP.ja.get(j[0]).push([j, dex]);
      }
    }
    ESP.ja.forEach(l => l.sort((a, b) => b[0].length - a[0].length));
  }).catch(e => { ESP.pret = null; throw e; });
}
/* Numéros de Pokédex présents dans le nom d'une carte (« ロケット団のフリーザー » → 144, « Pikachu V » → 25). */
function dexDeCarte(lang, n, mots) {
  const out = [], ajouter = d => { if (d && !out.includes(d)) out.push(d); };
  if (!ESP.noms.length) return out;
  // Noms en lettres latines (cartes FR/EN, et quelques cartes japonaises nommées en anglais)
  for (let i = 0; i < mots.length; i++) {
    if (!/[a-z]/.test(mots[i])) continue;
    const deux = i + 1 < mots.length ? ESP.parNom.get(mots[i] + " " + mots[i + 1]) : undefined;
    if (deux) { ajouter(deux); i++; continue; }
    ajouter(ESP.parNom.get(mots[i]));
  }
  // Noms japonais : pas d'espaces, on cherche les noms d'espèces dans le texte (le plus long d'abord)
  if (lang === "ja") {
    const s = n.replace(/ /g, "");
    for (let i = 0; i < s.length; i++) {
      const cands = ESP.ja.get(s[i]); if (!cands) continue;
      for (const [nm, dex] of cands) if (nm.length >= 2 && s.startsWith(nm, i)) { ajouter(dex); i += nm.length - 1; break; }
    }
  }
  return out;
}

/* Séries japonaises : leurs noms sont en japonais, on leur ajoute les noms français et anglais des séries équivalentes. */
const MOTS_SETS_JA = {
  PMCG1: "set de base base set expansion pack", PMCG2: "jungle", PMCG3: "fossile fossil", PMCG4: "team rocket equipe rocket",
  PMCG5: "gym heroes leaders stadium", PMCG6: "gym challenge", neo1: "neo genesis", neo2: "neo discovery", neo3: "neo revelation",
  neo4: "neo destiny", VS1: "vs", web1: "web", E1: "expedition", E2: "aquapolis", E3: "aquapolis", E4: "skyridge", E5: "skyridge"
};
const MOTS_SERIES_JA = {
  PMCG: "wizards", neo: "neo", e: "e card ecard", ADV: "ex", PCG: "ex", L: "heartgold soulsilver hgss legend", BW: "noir blanc black white",
  XY: "xy", XYb: "xy break", SM: "soleil lune sun moon", S: "epee bouclier sword shield swsh", SV: "ecarlate violet scarlet violet", M: "mega"
};
/* Anciennes séries japonaises : pas de numéro de collection imprimé, mais le n° du Pokédex (ex. Artikodin « No.144 »). */
const SANS_NUMERO = /^(PMCG\d|neo\d)/;

function preparerIndex(lang, cartes, sets, series) {
  const parSet = {};
  sets.forEach((s, i) => { parSet[s.id] = { id: s.id, nom: s.name, k: norm(s.name + " " + s.id), off: s.cardCount?.official ?? null, tot: s.cardCount?.total ?? null, rang: i }; });
  const liste = cartes.map(c => {
    const i = c.id.lastIndexOf("-"), set = c.id.slice(0, i);
    const n = norm(c.name), mots = n.split(" ");
    return { id: c.id, lang, local: c.localId, num: /^\d+$/.test(c.localId) ? parseInt(c.localId, 10) : null, nom: c.name, n, mots, set, img: c.image || "", dex: dexDeCarte(lang, n, mots) };
  });
  return { cartes: liste, parId: new Map(liste.map(c => [c.id, c])), sets: parSet, setsListe: Object.values(parSet), series: series || {} };
}
/* Mots-clés de recherche des séries : nom dans l'autre langue (même identifiant en FR et EN), équivalents des séries japonaises. */
function enrichirSets() {
  for (const l of ["fr", "en", "ja"]) {
    const ix = INDEX[l]; if (!ix) continue;
    for (const s of ix.setsListe) {
      let k = s.nom + " " + s.id;
      if (l !== "ja") { const autre = INDEX[l === "fr" ? "en" : "fr"]?.sets[s.id]; if (autre) k += " " + autre.nom; }
      else k += " " + (MOTS_SETS_JA[s.id] || "") + " " + (MOTS_SERIES_JA[ix.series[s.id]] || "");

/* Série de chaque set (pour reconstruire l'adresse des images que TCGdex ne liste pas). */
async function seriesDe(lang, cartes, sets) {
  const m = {};
  for (const c of cartes) if (c.image) { const p = c.image.split("/"); m[p[p.length - 2]] = p[p.length - 3]; }
  if (sets.some(s => !m[s.id])) {
    try {
      const ls = await api(lang, "series");
      const det = await Promise.all(ls.map(x => api(lang, "series/" + encodeURIComponent(x.id)).catch(() => null)));
      det.forEach(d => d?.sets?.forEach(s => { if (!m[s.id]) m[s.id] = d.id; }));
    } catch (e) { /* les images listées suffiront */ }
  }
  return m;
}
async function chargerIndex(lang, surProgression) {
  if (INDEX[lang]) return INDEX[lang];
  if (EN_COURS[lang]) return EN_COURS[lang];
  EN_COURS[lang] = (async () => {
    await chargerEspeces().catch(() => {});
    const cle = "index3-" + lang, cache = await IDB.lire(cle);
    if (cache && Date.now() - cache.t < 5 * 864e5) { INDEX[lang] = preparerIndex(lang, cache.cartes, cache.sets, cache.series); enrichirSets(); return INDEX[lang]; }
    surProgression?.(lang);
    try {
      const [cartes, sets] = await Promise.all([api(lang, "cards"), api(lang, "sets")]);
      const series = await seriesDe(lang, cartes, sets);
      IDB.ecrire(cle, { t: Date.now(), cartes, sets, series });
      INDEX[lang] = preparerIndex(lang, cartes, sets, series);
    } catch (e) {
      if (cache) INDEX[lang] = preparerIndex(lang, cache.cartes, cache.sets, cache.series); else throw e;
    }
    enrichirSets();
    return INDEX[lang];
  })();

}

/* ═══════════ Images ═══════════
   TCGdex ne liste qu'une partie des images (surtout en japonais) alors que beaucoup existent :
   on essaie dans l'ordre l'image connue, l'adresse reconstruite, la même carte dans l'autre langue, ta photo, puis un visuel neutre. */
const ASSETS = "https://assets.tcgdex.net";
/* Anciennes séries japonaises sans images chez TCGdex → série anglaise équivalente (même illustration, texte anglais). */
const JA_VERS_EN = { PMCG1: "base1", PMCG2: "base2", PMCG3: "base3", PMCG4: "base5", PMCG5: "gym1", PMCG6: "gym2",
  neo1: "neo1", neo2: "neo2", neo3: "neo3", neo4: "neo4", E1: "ecard1", E2: "ecard2", E3: "ecard2", E4: "ecard3", E5: "ecard3" };
function sourcesImage(lang, id, image) {
  const out = [], add = u => { if (u && !out.includes(u)) out.push(u); };
  const decoupe = x => { const i = x.lastIndexOf("-"); return [x.slice(0, i), x.slice(i + 1)]; };
  const chemin = (l, cid) => {
    const [set, local] = decoupe(cid);
    const s = INDEX[l]?.series?.[set] || (l !== "ja" ? INDEX.en?.series?.[set] || INDEX.fr?.series?.[set] : null);
    return s ? `${ASSETS}/${l}/${s}/${set}/${local}` : null;
  };
  add(image); add(chemin(lang, id));
  if (lang === "fr") add(chemin("en", id)); else if (lang === "en") add(chemin("fr", id));
  else {
    const [set] = decoupe(id), c = INDEX.ja?.parId.get(id), enSet = JA_VERS_EN[set];
    if (enSet && c?.dex.length && INDEX.en) {
      // Même Pokémon dans la série anglaise équivalente ; les holos (petits numéros) d'abord
      const eq = INDEX.en.cartes.filter(x => x.set === enSet && x.dex.length && x.dex.every(d => c.dex.includes(d))).sort((a, b) => (a.num ?? 999) - (b.num ?? 999));
      eq.slice(0, 2).forEach(x => add(x.img || chemin("en", x.id)));
    }
  }
  return out;
}
/* Visuel d'une carte : cadre neutre (nom, série, numéro) recouvert par la première image qui se charge. */
function visuel({ lang, id, image, photo, nom, meta, taille = "low", petit = false }) {
  const srcs = sourcesImage(lang, id, image).map(u => `${u}/${taille}.webp`);
  if (photo) srcs.push(photo);
  const fond = petit
    ? `<span class="sans petit" aria-hidden="true">${icone.cartes}</span>`
    : `<span class="sans"><span class="sans-nom">${esc(nom || "")}</span>${meta ? `<span class="sans-meta">${esc(meta)}</span>` : ""}<span class="sans-note">Visuel indisponible</span></span>`;
  return fond + (srcs.length ? `<img loading="lazy" alt="${esc(nom || "")}" src="${esc(srcs[0])}" data-lang="${esc(lang)}" data-suite="${esc(JSON.stringify(srcs.slice(1)))}" onerror="imgSuivante(this)" onload="imgChargee(this)">` : "");
}
/* Visuel venu d'une autre langue : petite mention sur l'image (« visuel EN »). */
window.imgChargee = el => {

  const conteneur = el.parentElement; if (!conteneur) return;

/* Nom français du Pokémon d'une carte anglaise ou japonaise (« フリーザー » → Artikodin). */
function nomFr(c) {

}
window.imgSuivante = el => {

/* ═══════════ Recherche intelligente ═══════════
   - sans accents ni majuscules, tolère les fautes de frappe (1 ou 2 lettres)
   - « 4/102 » : numéro et taille du set ; « 25 » seul : numéro ou nom de set (ex. « 151 »)
   - mots de set (« ténèbres », « base », « sv2a ») ; « fr », « en », « jp » pour la langue
   - les cartes possédées remontent en premier à pertinence égale */
const MOTS_LANGUE = { fr: "fr", vf: "fr", francais: "fr", francaise: "fr", en: "en", eng: "en", anglais: "en", english: "en", jp: "ja", ja: "ja", jap: "ja", japonais: "ja", japonaise: "ja", japan: "ja" };
function analyserRequete(q) {
  const r = { mots: [], num: null, denom: null, langue: null, brut: q };
  let t = String(q || "");
  const m = t.match(/(\d{1,3})\s*\/\s*(\d{1,3})/);
  if (m) { r.num = parseInt(m[1], 10); r.denom = parseInt(m[2], 10); t = t.replace(m[0], " "); }
  norm(t).split(" ").filter(Boolean).forEach(w => {
    if (MOTS_LANGUE[w] && !r.langue) r.langue = MOTS_LANGUE[w];
    else r.mots.push(w.replace(/^#/, "").replace(/^n[o°]?(\d+)$/, "$1"));
  });
  // Noms d'espèces en deux mots (« m mime », « type null ») gardés ensemble
  for (let i = 0; i + 1 < r.mots.length; i++) if (ESP.parNom.has(r.mots[i] + " " + r.mots[i + 1])) { r.mots.splice(i, 2, r.mots[i] + " " + r.mots[i + 1]); }
  return r;
}
function distance(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prec = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cour = [i]; let minLigne = i;
    for (let j = 1; j <= b.length; j++) {
      cour[j] = Math.min(prec[j] + 1, cour[j - 1] + 1, prec[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (cour[j] < minLigne) minLigne = cour[j];
    }
    if (minLigne > max) return max + 1;
    prec = cour;
  }
  return prec[b.length];
}
/* Espèces désignées par un mot de la recherche, dans n'importe quelle langue (exact, début de nom, faute de frappe). */
function dexPourMot(w) {
  if (!ESP.noms.length || /^\d+$/.test(w) || w.length < 3) return null;
  const ex = ESP.parNom.get(w) ?? ESP.parNom.get(w.replace(/ /g, ""));
  if (ex) return { set: new Set([ex]), exact: true };
  const s = new Set();
  if (w.length >= 4) for (const [n, d] of ESP.noms) if (n.startsWith(w)) s.add(d);
  if (!s.size && w.length >= 5) { const max = w.length >= 8 ? 2 : 1; for (const [n, d] of ESP.noms) if (n[0] === w[0] && distance(w, n, max) <= max) s.add(d); }
  return s.size && s.size <= 40 ? { set: s, exact: false } : null;
}
function scoreMot(w, c, set) {
  if (c.mots.includes(w)) return 30;
  if (c.mots.some(x => x.startsWith(w))) return w.length >= 2 ? 22 : 8;
  if (w.length >= 3 && c.n.includes(w)) return 15;
  if (set && (set.id.toLowerCase() === w || set.k.split(" ").includes(w))) return 14;
  if (set && w.length >= 3 && set.k.split(" ").some(x => x.startsWith(w))) return 11;
  if (/^\d+$/.test(w) && c.num === parseInt(w, 10)) return 16;
  if (w.length >= 4) {
    const max = w.length >= 7 ? 2 : 1;
    if (c.mots.some(x => x[0] === w[0] && distance(w, x.slice(0, w.length + max), max) <= max)) return 9;
  }
  return 0;
}
function rechercher(q, langues, limite = 400) {
  const r = analyserRequete(q);
  const langs = r.langue ? [r.langue] : langues;
  if (!r.mots.length && r.num == null) return { r, res: [] };
  const possedees = new Set(ETAT.cartes.filter(c => c.statut === "possedee").map(c => c.langue + ":" + c.carte_id));
  const especes = r.mots.map(dexPourMot);
  const res = [];
  for (const l of langs) {
    const ix = INDEX[l]; if (!ix) continue;
    for (const c of ix.cartes) {
      const set = ix.sets[c.set];
      let s = 0;
      if (r.num != null) {
        if (c.num !== r.num) continue;
        s += 25;
        if (r.denom != null && set) s += (set.off === r.denom || set.tot === r.denom) ? 30 : -12;
      }
      let ok = true;
      for (let k = 0; k < r.mots.length; k++) {
        const w = r.mots[k], e = especes[k];
        let v = scoreMot(w, c, set);
        if (e && c.dex.some(x => e.set.has(x))) v = Math.max(v, e.exact ? 28 : 20);
        if (!v && /^\d+$/.test(w) && c.lang === "ja" && SANS_NUMERO.test(c.set) && c.dex.includes(+w)) v = 18;
        if (!v) { ok = false; break; }
        s += v;
      }
      if (!ok) continue;
      if (r.mots.length && c.n === r.mots.join(" ")) s += 12;
      if (possedees.has(l + ":" + c.id)) s += 4;
      s += (set ? set.rang / ix.setsListe.length : 0) * 3;
      res.push({ c, s, set });
    }
  }
  res.sort((a, b) => b.s - a.s);
  return { r, res: res.slice(0, limite) };
}

/* Photo de la carte prise au scan : recadrée sur la carte, 700 px de haut, JPEG. */
function photoDuScan() {
  const S = Scan, ph = S.photos?.recto, m = S.mesures?.recto?.ext;
  if (!ph || !m) return null;
  const w = m.d - m.g, h = m.b - m.h; if (w < 40 || h < 40) return null;
  const ech = Math.min(1, 700 / h), c = document.createElement("canvas");
  c.width = Math.round(w * ech); c.height = Math.round(h * ech);

  return c;
}

}
/* Cotes à rafraîchir : cartes jamais relevées ou relevées il y a plus de 2 jours (le relevé de nuit s'occupe du reste). */

/* ═══════════ Courbe (SVG maison) ═══════════
   series : [{ nom, couleur, points:[{x:Date, y:Number, estime:bool}], aire }] */
function courbe(conteneur, series, opts = {}) {
  const tous = series.flatMap(s => s.points).filter(p => p.y != null);
  if (tous.length < 1) { conteneur.innerHTML = `<div class="vide" style="padding:40px 0">${opts.vide || "Pas encore de relevé."}</div>`; return; }
  const W = conteneur.clientWidth || 600, H = conteneur.clientHeight || 210, g = 46, d = 10, h = 16, b = 26;
  let xs = tous.map(p => +p.x), x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1) { x0 -= 864e5 * 3; x1 += 864e5 * 3; }
  let y0 = Math.min(...tous.map(p => p.y)), y1 = Math.max(...tous.map(p => p.y));
  if (y0 === y1) { y0 = y0 * .9; y1 = y1 * 1.1 || 1; }
  const marge = (y1 - y0) * .12; y0 = Math.max(0, y0 - marge); y1 += marge;
  const X = v => g + (v - x0) / (x1 - x0) * (W - g - d), Y = v => h + (1 - (v - y0) / (y1 - y0)) * (H - h - b);
  const graduations = [0, .5, 1].map(f => y0 + (y1 - y0) * f);
  const css = getComputedStyle(document.documentElement);
  const trait = css.getPropertyValue("--trait").trim(), doux = css.getPropertyValue("--doux").trim();
  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(opts.label || "Évolution")}">`;
  svg += `<defs>${series.map((s, i) => `<linearGradient id="aire${i}${opts.id || ""}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.couleur}" stop-opacity=".28"/><stop offset="1" stop-color="${s.couleur}" stop-opacity="0"/></linearGradient>`).join("")}</defs>`;
  graduations.forEach(v => { svg += `<line x1="${g}" x2="${W - d}" y1="${Y(v)}" y2="${Y(v)}" stroke="${trait}" stroke-dasharray="3 4"/><text x="${g - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="${doux}" font-family="JetBrains Mono,monospace">${esc(v >= 100 ? Math.round(v) : v.toFixed(v >= 10 ? 0 : 2))}</text>`; });
  [x0, x1].forEach((v, i) => { svg += `<text x="${i ? W - d : g}" y="${H - 6}" text-anchor="${i ? "end" : "start"}" font-size="11" fill="${doux}">${esc(new Date(v).toLocaleDateString("fr-FR", { day: "numeric", month: "short" }))}</text>`; });
  series.forEach((s, i) => {
    const pts = s.points.filter(p => p.y != null).sort((a, b) => a.x - b.x);
    if (!pts.length) return;
    if (s.aire && pts.length > 1) svg += `<path d="M${X(+pts[0].x)},${Y(pts[0].y)} ${pts.map(p => `L${X(+p.x)},${Y(p.y)}`).join(" ")} L${X(+pts.at(-1).x)},${H - b} L${X(+pts[0].x)},${H - b}Z" fill="url(#aire${i}${opts.id || ""})"/>`;
    for (let k = 1; k < pts.length; k++) {
      const a = pts[k - 1], c = pts[k], est = a.estime || c.estime;
      svg += `<line x1="${X(+a.x)}" y1="${Y(a.y)}" x2="${X(+c.x)}" y2="${Y(c.y)}" stroke="${s.couleur}" stroke-width="2.6" stroke-linecap="round" ${est ? 'stroke-dasharray="2 6"' : ""}/>`;
    }
    pts.forEach(p => { if (pts.length <= 40 || p === pts.at(-1)) svg += `<circle cx="${X(+p.x)}" cy="${Y(p.y)}" r="${p === pts.at(-1) ? 4.2 : 2.6}" fill="${p.estime ? "var(--fond)" : s.couleur}" stroke="${s.couleur}" stroke-width="2"/>`; });
  });
  svg += `<line class="curseur" x1="0" x2="0" y1="${h}" y2="${H - b}" stroke="${doux}" stroke-width="1" opacity="0"/></svg><div class="bulle" hidden></div>`;
  conteneur.innerHTML = svg;
  const bulle = conteneur.querySelector(".bulle"), curseur = conteneur.querySelector(".curseur");
  const jours = [...new Set(tous.map(p => +p.x))].sort((a, b) => a - b);
  const montrer = ev => {
    const rect = conteneur.getBoundingClientRect(), px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left, vx = px / rect.width * W;
    let meilleur = jours[0]; for (const j of jours) if (Math.abs(X(j) - vx) < Math.abs(X(meilleur) - vx)) meilleur = j;
    const lignes = series.map(s => { const p = s.points.find(q => +q.x === meilleur); return p && p.y != null ? `${esc(s.nom)} : <b>${eur(p.y)}</b>${p.estime ? " (estimé)" : ""}` : ""; }).filter(Boolean);
    curseur.setAttribute("x1", X(meilleur)); curseur.setAttribute("x2", X(meilleur)); curseur.setAttribute("opacity", ".6");
    bulle.hidden = false; bulle.innerHTML = lignes.join("<br>") + `<small>${esc(new Date(meilleur).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "long" }))}</small>`;
    bulle.style.left = Math.min(Math.max(X(meilleur) / W * rect.width, 70), rect.width - 70) + "px";
  };
  const cacher = () => { bulle.hidden = true; curseur.setAttribute("opacity", "0"); };
  conteneur.onmousemove = montrer; conteneur.onmouseleave = cacher;
  conteneur.ontouchstart = montrer; conteneur.ontouchmove = montrer; conteneur.ontouchend = () => setTimeout(cacher, 1600);
}

/* ═══════════ Calculs de collection ═══════════ */
function totaux() {
  const pos = ETAT.cartes.filter(c => c.statut === "possedee"), ven = ETAT.cartes.filter(c => c.statut === "vendue");
  const t = { brut: 0, gradee: 0, achat: 0, nb: 0, nbGradees: 0, sansCote: 0, ventes: 0, frais: 0, achatVendu: 0, nbVendu: 0, parLangue: { fr: 0, en: 0, ja: 0 } };
  pos.forEach(c => {
    const v = (c.valeur_unitaire ?? 0) * c.quantite;
    if (c.type === "gradee") { t.gradee += v; t.nbGradees += c.quantite; } else t.brut += v;
    if (c.valeur_unitaire == null) t.sansCote++;
    t.achat += (c.prix_achat ?? 0) * c.quantite; t.nb += c.quantite; t.parLangue[c.langue] += v;
  });
  ven.forEach(c => { t.ventes += (c.prix_vente ?? 0) * c.quantite; t.frais += c.frais_vente ?? 0; t.achatVendu += (c.prix_achat ?? 0) * c.quantite; t.nbVendu += c.quantite; });
  t.total = t.brut + t.gradee;
  t.benefice = t.ventes - t.frais - t.achatVendu;
  return t;
}
function ligneCarte(c, droite) {
  const badge = c.type === "gradee" ? `<span class="puce gradee">${esc(c.gradeur || "Gradée")} ${c.note != null ? esc(String(c.note).replace(".0", "")) : ""}</span>` : `<span class="puce">${esc(c.etat || "NM")}</span>`;
  return `<button class="ligne" data-ouvrir="${esc(c.id)}">
    <span class="vignette">${visuel({ lang: c.langue, id: c.carte_id, image: c.image, photo: c.photo_url, petit: true })}</span>
    <span style="min-width:0"><span class="nom">${esc(c.nom)}${c.quantite > 1 ? ` <span class="puce">×${c.quantite}</span>` : ""}</span>
      <span class="meta"><span class="puce ${c.langue}">${COURT[c.langue]}</span>${badge}<span>${esc(c.set_nom || "")} · ${esc(c.numero || "")}</span></span></span>
    <span class="droite">${droite}</span></button>`;
}

async function lancerRecherche() {
  const R = ETAT.recherche, zone = $("#resultats"), info = $("#etat-index");
  if (!zone) return;
  const blocSuivis = $("#bloc-suivis");
  if (!R.q.trim()) { zone.innerHTML = ""; info.innerHTML = ""; if (blocSuivis) blocSuivis.hidden = false; return; }
  if (blocSuivis) blocSuivis.hidden = true;
  const manquantes = R.langues.filter(l => !INDEX[l]);
  if (manquantes.length) {
    info.innerHTML = `<span class="chargement"></span> Préparation de l’index des cartes (${manquantes.map(l => LANGUES[l].toLowerCase()).join(", ")})… une seule fois, puis instantané.`;
    try { await Promise.all(manquantes.map(l => chargerIndex(l))); } catch (e) { info.textContent = "Impossible de charger la liste des cartes. Vérifie ta connexion."; return; }
    if (R.q !== $("#q")?.value) return;
  }
  const { r, res } = rechercher(R.q, R.langues);
  info.textContent = res.length ? `${res.length >= 400 ? "400+" : res.length} carte${res.length > 1 ? "s" : ""}${r.langue ? " · " + LANGUES[r.langue].toLowerCase() : ""}${r.num != null ? ` · n° ${r.num}${r.denom ? "/" + r.denom : ""}` : ""}` : "";
  if (!res.length) { zone.innerHTML = `<div class="carte-ui vide">Aucune carte trouvée pour « ${esc(R.q)} ».<br><small>Essaie le nom dans une autre langue (Dracaufeu / Charizard), ou seulement le numéro.${R.langues.includes("ja") || r.langue === "ja" ? "<br>Les cartes japonaises portent leur nom en japonais : cherche-les par numéro, par exemple <code>25/165 jp</code>." : ""}</small></div>`; return; }
  const possede = new Map();
  ETAT.cartes.filter(c => c.statut === "possedee").forEach(c => possede.set(c.langue + ":" + c.carte_id, (possede.get(c.langue + ":" + c.carte_id) || 0) + c.quantite));
  zone.innerHTML = `<div class="galerie">${res.slice(0, R.vus).map(({ c, set }) => {
    const n = possede.get(c.lang + ":" + c.id);
    return `<button class="tuile" data-carte="${esc(c.id)}" data-lang="${c.lang}">
      <span class="img">${visuel({ lang: c.lang, id: c.id, image: c.img, nom: c.nom, meta: `${set?.nom || c.set} · ${c.local}` })}

      <span class="t-nom">${esc(c.nom)}</span>${nomFr(c) ? `<span class="t-fr">${esc(nomFr(c))}</span>` : ""}<span class="t-meta">${esc(set?.nom || c.set)} · ${esc(c.local)}${set?.off ? "/" + set.off : ""}</span></button>`;
  }).join("")}</div>${res.length > R.vus ? `<div style="text-align:center;margin-top:16px"><button class="btn" id="plus">Afficher plus</button></div>` : ""}`;
  $$("[data-carte]", zone).forEach(b => b.onclick = () => ouvrirFiche(b.dataset.lang, b.dataset.carte));
  const plus = $("#plus"); if (plus) plus.onclick = () => { R.vus += 48; lancerRecherche(); };
}

/* ═══════════ Feuille (fenêtre glissante) ═══════════ */
function feuille(titre, html, surFermer) {
  fermerFeuille(true);
  const voile = document.createElement("div"); voile.className = "voile";
  const f = document.createElement("section"); f.className = "feuille"; f.setAttribute("role", "dialog"); f.setAttribute("aria-modal", "true"); f.setAttribute("aria-label", titre);
  f.innerHTML = `<div class="poignee"></div><div class="f-tete"><h2>${esc(titre)}</h2><button class="icone-btn" data-fermer aria-label="Fermer">${icone.fermer}</button></div><div class="f-corps">${html}</div>`;
  document.body.append(voile, f);
  document.body.style.overflow = "hidden";
  requestAnimationFrame(() => { voile.classList.add("ok"); f.classList.add("ok"); });
  const fermer = () => fermerFeuille();
  voile.onclick = fermer; f.querySelector("[data-fermer]").onclick = fermer;
  feuille.courante = { voile, f, surFermer };
  return f;
}
function fermerFeuille(immediat) {
  const c = feuille.courante; if (!c) return;
  feuille.courante = null; document.body.style.overflow = "";
  c.surFermer?.();
  if (immediat) { c.voile.remove(); c.f.remove(); return; }
  c.voile.classList.remove("ok"); c.f.classList.remove("ok");
  setTimeout(() => { c.voile.remove(); c.f.remove(); }, 260);
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && feuille.courante) fermerFeuille(); });

        <button class="btn" id="f-suivre" aria-pressed="${suivie}">${suivie ? icone.etoilePleine + " Suivie" : icone.etoile + " Suivre la cote"}</button>
      </div>
      <div class="btns" style="margin-top:8px">
        <a class="btn discret" target="_blank" rel="noopener" href="https://www.cardmarket.com/fr/Pokemon/Products/Search?searchString=${encodeURIComponent(carte.name)}">${icone.lien} Cardmarket</a>
        <a class="btn discret" target="_blank" rel="noopener" href="https://www.ebay.fr/sch/i.html?_nkw=${rech}&LH_Sold=1&LH_Complete=1">${icone.lien} Ventes eBay</a>
      </div>
      ${mesExemplaires.length ? `<div class="titre-section"><h2 style="font-size:17px">Mes exemplaires</h2></div><div class="exemplaires liste">${mesExemplaires.map(x => ligneCarte(x, x.statut === "vendue" ? `<b>${eur(x.prix_vente)}</b><small>vendue</small>` : `<b>${eur(x.valeur_unitaire)}</b><small>${x.type === "gradee" ? "valeur saisie" : "estimée"}</small>`)).join("")}</div>` : ""}
    </div>
  </div>`;
  brancherLignes();
  $("#f-ajouter").onclick = () => formulaireCarte({ carte, lang });
  $("#f-suivre").onclick = () => basculerSuivi(carte, lang);
  // Courbe : historique enregistré, sinon points estimés à partir des moyennes du jour
  let hist = [];
  try { const { data } = await sb.from("prix").select("*").eq("carte_id", carte.id).eq("langue", lang).order("jour"); hist = data || []; } catch (e) {}
  if (feuille.courante?.f !== f) return;
  const jour = d => new Date(d + "T12:00:00");
  let normale, reverse;
  if (hist.length) {
    normale = hist.map(p => ({ x: jour(p.jour), y: p.cm_trend != null ? +p.cm_trend : p.cm_avg30 != null ? +p.cm_avg30 : null, estime: p.source === "moyenne" }));
    reverse = hist.map(p => ({ x: jour(p.jour), y: p.cm_trend_holo != null ? +p.cm_trend_holo : null, estime: p.source === "moyenne" }));
    const reels = hist.filter(p => p.source === "releve").length;
    $("#info-courbe").textContent = `${reels} relevé${reels > 1 ? "s" : ""} depuis le ${dateFr(hist[0].jour)}`;
  } else if (cm) {
    const j = n => new Date(Date.now() - n * 864e5);
    normale = [[15, cm.avg30], [4, cm.avg7], [1, cm.avg1]].filter(x => x[1]).map(([n, v]) => ({ x: j(n), y: v, estime: true })).concat(cm.trend ? [{ x: j(0), y: cm.trend }] : []);
    reverse = [[15, cm["avg30-holo"]], [4, cm["avg7-holo"]], [1, cm["avg1-holo"]]].filter(x => x[1]).map(([n, v]) => ({ x: j(n), y: v, estime: true })).concat(cm["trend-holo"] ? [{ x: j(0), y: cm["trend-holo"] }] : []);
    $("#info-courbe").textContent = "Suis la carte pour un relevé chaque jour";
  }
  const css = getComputedStyle(document.documentElement);
  const series = [{ nom: "Cote", couleur: css.getPropertyValue("--accent").trim(), points: normale || [], aire: true }];
  if (reverse?.some(p => p.y)) series.push({ nom: "Reverse", couleur: css.getPropertyValue("--ja").trim(), points: reverse });
  courbe($("#courbe-carte"), series, { id: "c", label: "Cote de la carte", vide: "Pas de cote disponible." });
  $("#legende-carte").innerHTML = series.map(s => `<span><i style="background:${s.couleur}"></i>${s.nom}</span>`).join("") + `<span><i class="pointille" style="color:var(--doux)"></i>estimé (moyennes Cardmarket)</span>`;
}
async function basculerSuivi(carte, lang) {
  const existe = ETAT.suivis.find(s => s.carte_id === carte.id && s.langue === lang);
  const b = $("#f-suivre"); if (b) b.disabled = true;
  try {
    if (existe) {
      const { error } = await sb.from("suivis").delete().eq("carte_id", carte.id).eq("langue", lang); if (error) throw error;
      ETAT.suivis = ETAT.suivis.filter(s => s !== existe); toast("Carte retirée du suivi");
    } else {
      const ligne = { carte_id: carte.id, langue: lang, nom: carte.name, image: carte.image || null, set_nom: carte.set?.name || null, numero: carte.localId + (carte.set?.cardCount?.official ? "/" + carte.set.cardCount.official : "") };
      const { data, error } = await sb.from("suivis").insert(ligne).select().single(); if (error) throw error;
      ETAT.suivis.unshift(data);
      sb.rpc("rafraichir_prix", { p_carte: carte.id, p_langue: lang }).then(() => {});
      toast("Cote suivie : relevée chaque nuit");
    }
    if (b) { const s = !existe; b.setAttribute("aria-pressed", s); b.innerHTML = s ? icone.etoilePleine + " Suivie" : icone.etoile + " Suivre la cote"; }
  } catch (e) { erreur(e, "Suivi"); }
  if (b) b.disabled = false;
}

    };

function formulaireVente(L) {
  const f = feuille("Vendre", `
  <form id="f-vente" class="grille">
    <div style="display:flex;gap:12px;align-items:center"><span class="vignette" style="width:56px">${visuel({ lang: L.langue, id: L.carte_id, image: L.image, photo: L.photo_url, petit: true })}</span>
      <div><b style="font-family:var(--f-titre);font-size:18px">${esc(L.nom)}</b><div class="source" style="margin:2px 0 0">Valeur actuelle : ${eur(L.valeur_unitaire)} / unité · achetée ${eur(L.prix_achat)}</div></div></div>
    <div class="champs">
      <label class="champ"><span>Quantité vendue</span><input name="q" type="number" inputmode="numeric" min="1" max="${L.quantite}" value="${L.quantite}"></label>
      <label class="champ"><span>Prix de vente (€ / unité)</span><input name="prix" inputmode="decimal" required value="${L.valeur_unitaire ?? ""}"></label>
      <label class="champ"><span>Frais (port, commission… total)</span><input name="frais" inputmode="decimal" value=""></label>
      <label class="champ"><span>Date</span><input name="date" type="date" value="${aujourdhui()}"></label>
      <label class="champ large"><span>Vendue sur</span><select name="plateforme">${PLATEFORMES.map(p => `<option>${p}</option>`).join("")}</select></label>
    </div>
    <div class="carte-ui" id="bilan-vente" style="padding:12px 14px"></div>
    <button class="btn bleu plein" type="submit">${icone.euro} Enregistrer la vente</button>
  </form>`);
  const form = $("#f-vente", f);
  const bilan = () => {
    const q = Math.min(L.quantite, Math.max(1, parseInt(form.q.value, 10) || 1)), p = num(form.prix.value) ?? 0, fr = num(form.frais.value) ?? 0;
    const ben = p * q - fr - (L.prix_achat ?? 0) * q;
    $("#bilan-vente", f).innerHTML = `Encaissé <b class="chiffre">${eur(p * q - fr)}</b> · bénéfice <b class="chiffre ${signe(ben)}">${eur(ben)}</b>${L.prix_achat == null ? " <small>(prix d’achat inconnu, compté 0 €)</small>" : ""}`;
  };
  form.oninput = bilan; bilan();
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const q = Math.min(L.quantite, Math.max(1, parseInt(form.q.value, 10) || 1)), prix = num(form.prix.value);
    if (prix == null) return toast("Indique le prix de vente.");
    const vente = { statut: "vendue", prix_vente: prix, frais_vente: num(form.frais.value), date_vente: form.date.value || aujourdhui(), plateforme_vente: form.plateforme.value };
    try {
      if (q >= L.quantite) {
        const { error } = await sb.from("cartes").update(vente).eq("id", L.id); if (error) throw error;
      } else {
        // Vente partielle : le lot garde le reste, une nouvelle ligne porte les cartes vendues
        const copie = { ...L }; ["id", "user_id", "cree_le", "maj_le", "cote_jour", "cote_maj", "cote", "coef_etat", "valeur_unitaire", "photo_url"].forEach(k => delete copie[k]);
        const { error: e1 } = await sb.from("cartes").insert({ ...copie, ...vente, quantite: q }); if (e1) throw e1;
        const { error: e2 } = await sb.from("cartes").update({ quantite: L.quantite - q }).eq("id", L.id); if (e2) throw e2;
      }
      await sb.rpc("calculer_mes_valeurs"); await chargerDonnees();
      fermerFeuille(); toast("Vente enregistrée"); rendre();
    } catch (err) { erreur(err, "Vente"); }
  });
}

/* ═══════════ Vue : Collection ═══════════ */
function vueCollection() {
  const F = ETAT.filtres, t = totaux();
  $("#vue").innerHTML = `
  <div class="titre-section" style="margin-top:4px"><h2>Ma collection</h2><span class="petit"><b class="chiffre" style="color:var(--encre)">${eur(t.total, true)}</b> · ${t.nb} carte${t.nb > 1 ? "s" : ""}</span></div>
  <div class="recherche" style="margin-bottom:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="cq" type="search" placeholder="Filtrer ma collection" value="${esc(F.q)}" style="padding-right:16px"></div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center">
    <div class="chips">${[["tous", "Toutes"], ["brut", "Brutes"], ["gradee", "Gradées"]].map(([k, n]) => `<button class="chip" data-ft="${k}" aria-pressed="${F.type === k}">${n}</button>`).join("")}
      ${[["toutes", "Toutes langues"], ...Object.entries(COURT)].map(([k, n]) => `<button class="chip" data-fl="${k}" aria-pressed="${F.langue === k}">${n}</button>`).join("")}</div>
    <label class="champ" style="flex-direction:row;align-items:center;gap:8px"><span>Trier</span><select id="tri" style="min-height:38px;padding:6px 10px;width:auto">${[["valeur", "Valeur"], ["recent", "Ajout récent"], ["nom", "Nom"], ["plusvalue", "Plus-value"], ["set", "Série"]].map(([k, n]) => `<option value="${k}" ${F.tri === k ? "selected" : ""}>${n}</option>`).join("")}</select></label>
  </div>
  <div class="liste" id="liste-col" style="margin-top:12px"></div>`;
  const dessiner = () => {
    let l = ETAT.cartes.filter(c => c.statut === "possedee");
    if (F.type !== "tous") l = l.filter(c => c.type === F.type);
    if (F.langue !== "toutes") l = l.filter(c => c.langue === F.langue);
    if (F.q.trim()) { const q = norm(F.q); l = l.filter(c => norm(`${c.nom} ${c.set_nom} ${c.numero} ${c.gradeur || ""} ${c.notes || ""}`).includes(q)); }
    const val = c => (c.valeur_unitaire ?? 0) * c.quantite, pv = c => val(c) - (c.prix_achat ?? 0) * c.quantite;

  dessiner();
}

/* ═══════════════════════════════════════════════════════════════════════
   SCANNER : reconnaissance par le numéro imprimé + mesure du centrage
   ═══════════════════════════════════════════════════════════════════════ */
const BAREME_PSA = [[10, 55, 75], [9, 60, 90], [8, 65, 90], [7, 70, 90], [6, 80, 90], [5, 85, 90], [4, 85, 90], [3, 90, 90]];

const CRITERES = [["coins", "Coins", "blanchiment, pointes émoussées"], ["bords", "Bords", "éclats, blanchiment sur la tranche"], ["surface", "Surface", "rayures, traces, plis, impression"]];
const SEUIL_FLOU = 40;
const Scan = {
  flux: null, etape: "camera", face: "recto", photos: {}, mesures: {}, controle: {}, carte: null, lampe: false,
  arreter() { if (this.flux) { this.flux.getTracks().forEach(t => t.stop()); this.flux = null; } }
};

function vueScan() {
  const S = Scan;
  const etapes = [["camera", "1. Photo"], ["centrage", "2. Centrage"], ["controle", "3. État"], ["carte", "4. Carte"]];

}
function recommencerScan() { Object.assign(Scan, { etape: "camera", face: "recto", photos: {}, mesures: {}, controle: {}, carte: null }); vueScan(); }

/* Étape 1 : caméra en direct avec cadre, ou appareil photo du téléphone / galerie.
   Mise au point : un téléphone ne fait pas le point à moins de ~12 cm, d'où un cadre plus petit (tenir à ~20 cm),
   le toucher pour faire le point (Android/Chrome), la photo pleine résolution et un contrôle de netteté. */
async function scanCamera(entete) {
  const S = Scan;
  $("#vue").innerHTML = `${entete}
  <div class="titre-section" style="margin-top:0"><h2>${S.face === "recto" ? "Photographie le recto" : "Photographie le verso"}</h2>${S.face === "verso" ? `<button class="btn discret" id="b-sauter">Passer le verso</button>` : ""}</div>
  <div class="scan-zone" id="zone"><video id="video" playsinline muted autoplay></video><div class="guide" id="guide"><span class="guide-aide">Touche la carte pour faire la mise au point</span></div>
    <div class="anneau" id="anneau" hidden></div>
    <div class="zoom" id="zoom-bloc" hidden><span>1×</span><input type="range" id="zoom" min="1" max="3" step="0.1" value="1" aria-label="Zoom"><span id="zoom-val">1×</span></div>
    <div class="ctl"><label class="icone-btn" title="Choisir une photo de la galerie" aria-label="Choisir une photo de la galerie">${icone.image}<input type="file" accept="image/*" id="fichier" hidden></label><button class="obturateur" id="declencher" aria-label="Prendre la photo"></button><button class="icone-btn" id="b-lampe" title="Lampe" aria-label="Allumer la lampe" hidden>${icone.lampe}</button></div></div>
  <div class="scan-natif">
    <label class="btn plein">${icone.photo} Utiliser l’appareil photo du téléphone<input type="file" accept="image/*" capture="environment" id="fichier-natif" hidden></label>
    <p class="source">Mise au point la plus fiable, surtout sur iPhone. Cadre la carte au centre, en remplissant bien la photo.</p>
  </div>
  <p class="source" style="text-align:center">Téléphone à <b>15–20 cm</b>, bien parallèle à la carte, posée à plat sur un fond sombre et uni, sans reflet.</p>`;
  $("#fichier").onchange = e => { const fi = e.target.files[0]; if (fi) chargerPhoto(fi); };
  $("#fichier-natif").onchange = e => { const fi = e.target.files[0]; if (fi) chargerPhoto(fi); };
  const sauter = $("#b-sauter"); if (sauter) sauter.onclick = () => { S.arreter(); S.etape = "controle"; vueScan(); };
  try {
    S.arreter();
    S.flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 3840 }, height: { ideal: 2160 } }, audio: false });
    if (ETAT.vue !== "scan") return S.arreter();
    const v = $("#video"); v.srcObject = S.flux; await v.play().catch(() => {});
    const piste = S.flux.getVideoTracks()[0], cap = piste.getCapabilities?.() || {}, modes = cap.focusMode || [];
    if (modes.includes("continuous")) piste.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(() => {});
    if (cap.torch) { const b = $("#b-lampe"); b.hidden = false; b.onclick = e => { e.stopPropagation(); S.lampe = !S.lampe; piste.applyConstraints({ advanced: [{ torch: S.lampe }] }).catch(() => {}); b.style.color = S.lampe ? "var(--or)" : ""; }; }
    if (cap.zoom && cap.zoom.max > cap.zoom.min) {
      const z = $("#zoom"), bloc = $("#zoom-bloc"); bloc.hidden = false;
      z.min = cap.zoom.min; z.max = Math.min(cap.zoom.max, 4); z.step = cap.zoom.step || .1; z.value = piste.getSettings?.().zoom || cap.zoom.min;
      const maj = () => { $("#zoom-val").textContent = (+z.value).toFixed(1).replace(".0", "") + "×"; piste.applyConstraints({ advanced: [{ zoom: +z.value }] }).catch(() => {}); };
      z.oninput = maj; bloc.onclick = e => e.stopPropagation(); maj();
    }
    // Position dans l'image de la caméra d'un point de l'écran (la vidéo est affichée en « cover »)
    const versImage = (px, py) => {
      const zone = $("#zone").getBoundingClientRect(), vw = v.videoWidth, vh = v.videoHeight, ech = Math.max(zone.width / vw, zone.height / vh);
      const ox = (zone.width - vw * ech) / 2, oy = (zone.height - vh * ech) / 2;
      return { x: (px - zone.left - ox) / ech, y: (py - zone.top - oy) / ech, ech };
    };
    const faireLePoint = async (fx, fy) => {
      const pt = [{ x: Math.min(1, Math.max(0, fx)), y: Math.min(1, Math.max(0, fy)) }];
      try {
        if (modes.includes("single-shot")) await piste.applyConstraints({ advanced: [{ focusMode: "single-shot", pointsOfInterest: pt }] });
        else if (modes.includes("continuous")) {
          if (modes.includes("manual")) await piste.applyConstraints({ advanced: [{ focusMode: "manual" }] });
          await piste.applyConstraints({ advanced: [{ focusMode: "continuous", pointsOfInterest: pt }] });
        } else return false;
        return true;
      } catch (e) { return false; }
    };
    let prevenu = false;
    $("#zone").addEventListener("click", async e => {
      if (e.target.closest(".ctl,.zoom")) return;
      const zone = $("#zone").getBoundingClientRect(), a = $("#anneau");
      a.hidden = false; a.style.left = (e.clientX - zone.left) + "px"; a.style.top = (e.clientY - zone.top) + "px";
      a.classList.remove("ok"); void a.offsetWidth; a.classList.add("ok");
      const p = versImage(e.clientX, e.clientY);
      const ok = await faireLePoint(p.x / v.videoWidth, p.y / v.videoHeight);
      if (!ok && !prevenu) { prevenu = true; toast("Ce navigateur ne laisse pas régler la mise au point : utilise « Appareil photo du téléphone ».", 5000); }
    });
    $("#declencher").onclick = async e => {
      e.stopPropagation();
      const bouton = e.currentTarget; if (bouton.disabled) return;
      bouton.disabled = true; bouton.classList.add("occupe");
      const g = $("#guide").getBoundingClientRect(), hg = versImage(g.left, g.top), bd = versImage(g.right, g.bottom);
      const vw = v.videoWidth, vh = v.videoHeight, marge = .07;
      // Cadre en proportions de l'image, avec une marge pour voir les bords de la carte
      let rx = hg.x / vw, ry = hg.y / vh, rw = (bd.x - hg.x) / vw, rh = (bd.y - hg.y) / vh;
      rx -= rw * marge; ry -= rh * marge; rw *= 1 + 2 * marge; rh *= 1 + 2 * marge;
      rx = Math.max(0, rx); ry = Math.max(0, ry); rw = Math.min(1 - rx, rw); rh = Math.min(1 - ry, rh);
      // Point fait au centre juste avant la photo, si possible
      if (await faireLePoint(.5, .5)) await new Promise(r => setTimeout(r, 650));
      let source = v, sw = vw, sh = vh;
      // Photo pleine résolution (Android/Chrome) si son cadrage correspond à la vidéo
      if (window.ImageCapture) {
        try {
          const blob = await new ImageCapture(piste).takePhoto();
          const bmp = await createImageBitmap(blob);
          if (Math.abs(bmp.width / bmp.height - vw / vh) < .03) { source = bmp; sw = bmp.width; sh = bmp.height; }
        } catch (err) { /* image de la vidéo */ }
      }
      const x = rx * sw, y = ry * sh, w = rw * sw, h = rh * sh;
      const c = document.createElement("canvas"), ech2 = Math.min(1, 1800 / h);
      c.width = Math.round(w * ech2); c.height = Math.round(h * ech2);
      c.getContext("2d").drawImage(source, x, y, w, h, 0, 0, c.width, c.height);
      S.arreter();
      enregistrerPhoto(c, true);
    };
  } catch (e) {
    $("#zone").innerHTML = `<div class="vide" style="color:#fff;padding:60px 20px">Caméra indisponible ici (${esc(e.name === "NotAllowedError" ? "autorisation refusée" : e.message || e.name)}).<br>Utilise l’appareil photo du téléphone avec le bouton ci-dessous.</div>`;
  }
}
function chargerPhoto(fichier) {
  const img = new Image();
  img.onload = () => {
    const ech = Math.min(1, 2400 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * ech); c.height = Math.round(img.height * ech);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    Scan.arreter(); enregistrerPhoto(c, false);
  };
  img.onerror = () => toast("Image illisible.");
  img.src = URL.createObjectURL(fichier);
}
/* Netteté : variance du laplacien sur l'intérieur de la carte, image ramenée à 600 px de large. */
function nettete(canvas, ext) {
  const sx = ext ? ext.g : 0, sy = ext ? ext.h : 0, sw = ext ? ext.d - ext.g : canvas.width, sh = ext ? ext.b - ext.h : canvas.height;
  const ech = Math.min(1, 600 / sw), w = Math.max(20, Math.round(sw * ech)), h = Math.max(20, Math.round(sh * ech));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(canvas, sx, sy, sw, sh, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
  for (let i = 0, p = 0; i < g.length; i++, p += 4) g[i] = d[p] * .299 + d[p + 1] * .587 + d[p + 2] * .114;
  let s = 0, s2 = 0, n = 0;
  for (let yy = Math.round(h * .08); yy < Math.round(h * .92); yy++) for (let xx = Math.round(w * .08); xx < Math.round(w * .92); xx++) {
    const i = yy * w + xx, l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - w] - g[i + w]; s += l; s2 += l * l; n++;
  }
  const m = s / Math.max(1, n); return s2 / Math.max(1, n) - m * m;
}
function enregistrerPhoto(canvas, cadree) {
  const S = Scan;
  S.photos[S.face] = canvas;
  S.mesures[S.face] = detecterBords(canvas, cadree);
  S.nettete = S.nettete || {};
  S.nettete[S.face] = nettete(canvas, S.mesures[S.face].ext);
  S.etape = "centrage"; vueScan();
}

/* Détection des bords : profils de gradient sur les lignes et colonnes centrales.
   Extérieur = bord de la carte ; intérieur = fin de la bordure (cadre de l'illustration ou du texte). */
function detecterBords(canvas, cadree) {
  const W = canvas.width, H = canvas.height, d = canvas.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, W, H).data;
  // Écart de couleur (R+V+B) plutôt que de luminosité : une bordure jaune et un fond gris clair ont presque la même luminosité.
  const ecart = (a, b) => Math.abs(d[a] - d[b]) + Math.abs(d[a + 1] - d[b + 1]) + Math.abs(d[a + 2] - d[b + 2]);
  const profilX = (y0, y1) => { const r = new Float32Array(W); for (let y = y0; y < y1; y += 2) { const o = y * W; for (let x = 1; x < W - 1; x++) r[x] += ecart((o + x + 1) * 4, (o + x - 1) * 4); } return lisser(r); };
  const profilY = (x0, x1) => { const r = new Float32Array(H); for (let y = 1; y < H - 1; y++) { const o = y * W; let s = 0; for (let x = x0; x < x1; x += 2) s += ecart((o + W + x) * 4, (o - W + x) * 4); r[y] = s; } return lisser(r); };
  const lisser = r => { const s = new Float32Array(r.length); for (let i = 2; i < r.length - 2; i++) s[i] = (r[i - 2] + 2 * r[i - 1] + 3 * r[i] + 2 * r[i + 1] + r[i + 2]) / 9; return s; };
  const pic = (r, a, b) => { a = Math.max(2, Math.round(a)); b = Math.min(r.length - 3, Math.round(b)); let m = a; for (let i = a; i <= b; i++) if (r[i] > r[m]) m = i; return m; };
  // Première transition nette en partant du bord de la carte (la fin de la bordure vient avant le cadre de l'illustration)
  const premierPic = (r, depart, arrivee) => {
    const a = Math.round(Math.min(depart, arrivee)), b = Math.round(Math.max(depart, arrivee));
    const m = r[pic(r, a, b)], seuil = m * .42, pas = arrivee > depart ? 1 : -1;
    for (let i = Math.round(depart); pas > 0 ? i <= arrivee : i >= arrivee; i += pas) {
      if (r[i] >= seuil) { let j = i; while (r[j + pas] >= r[j]) j += pas; return j; }
    }
    return pic(r, a, b);
  };
  // 1. Bords extérieurs : dans les zones où la carte doit se trouver
  const zx = cadree ? 0.2 : 0.42, zy = cadree ? 0.18 : 0.42;
  let px = profilX(Math.round(H * .3), Math.round(H * .7)), py = profilY(Math.round(W * .3), Math.round(W * .7));
  const ext = { g: pic(px, 0, W * zx), d: pic(px, W * (1 - zx), W - 1), h: pic(py, 0, H * zy), b: pic(py, H * (1 - zy), H - 1) };
  // 2. Bordure intérieure : entre 2 % et 13 % de la carte, profils recalculés à l'intérieur de la carte
  const cw = ext.d - ext.g, ch = ext.b - ext.h;
  px = profilX(Math.round(ext.h + ch * .28), Math.round(ext.b - ch * .28));
  py = profilY(Math.round(ext.g + cw * .25), Math.round(ext.d - cw * .25));
  const int = {
    g: premierPic(px, ext.g + cw * .02, ext.g + cw * .13), d: premierPic(px, ext.d - cw * .02, ext.d - cw * .13),
    h: premierPic(py, ext.h + ch * .02, ext.h + ch * .11), b: premierPic(py, ext.b - ch * .02, ext.b - ch * .11)

}
function ratios(m) {

  const f = (a, b) => { const t = a + b; if (t <= 0) return null; const p = Math.round(Math.max(a, b) / t * 100); return { max: p, txt: `${a >= b ? p : 100 - p}/${a >= b ? 100 - p : p}` }; };
