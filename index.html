}
function noteCentrage(recto, verso) {
  const fr = Math.max(recto?.lr?.max ?? 50, recto?.hb?.max ?? 50), ve = verso ? Math.max(verso.lr?.max ?? 50, verso.hb?.max ?? 50) : null;
  for (const [n, f, b] of BAREME_PSA) if (fr <= f && (ve == null || ve <= b)) return n;
  return 2;
}

/* Étape 2 : éditeur de centrage (lignes déplaçables + loupe) */
function scanCentrage(entete) {
  const S = Scan, canvas = S.photos[S.face], m = S.mesures[S.face];
  $("#vue").innerHTML = `${entete}
  <div class="titre-section" style="margin-top:0"><h2>Centrage du ${S.face}</h2><button class="btn discret" id="b-reprendre">Reprendre</button></div>
  ${(S.nettete?.[S.face] ?? 999) < SEUIL_FLOU ? `<div class="alerte-flou"><span>La photo semble floue : la mesure et la lecture du numéro seront moins fiables.</span><button class="btn principal" id="b-reprendre2">Reprendre la photo</button></div>` : ""}
  <div class="grille deux">
    <div><div class="editeur" id="editeur"><canvas id="toile"></canvas><div class="loupe" id="loupe" hidden><canvas width="236" height="236"></canvas></div></div>
      <p class="source" style="text-align:center">Glisse les lignes : <b style="color:var(--or)">jaunes</b> sur le bord de la carte, <b style="color:var(--bleu)">bleues</b> sur la fin de la bordure. Une loupe apparaît pendant le réglage.</p></div>
    <div class="grille" style="align-content:start">
      <div class="mesures" id="mesures"></div>
      <div class="note-estimee" id="note-centrage"></div>
      <p class="source" style="margin:0">Barèmes PSA pour le centrage : 55/45 au recto (75/25 au verso) pour un 10, 60/40 pour un 9, 65/35 pour un 8. Les cartes sans bordure (full art) ne se mesurent pas ainsi.</p>
      <div class="btns">${S.face === "recto"
        ? `<button class="btn principal" id="b-verso" style="flex:1">Mesurer aussi le verso</button><button class="btn" id="b-suite">Passer à l’état</button>`
        : `<button class="btn principal" id="b-suite" style="flex:1">Passer à l’état</button>`}</div>
    </div>
  </div>`;
  const toile = $("#toile"), ctx = toile.getContext("2d"), ed = $("#editeur"), loupe = $("#loupe"), lctx = loupe.querySelector("canvas").getContext("2d");
  toile.width = canvas.width; toile.height = canvas.height;
  const lignes = [["ext", "g", "x"], ["ext", "d", "x"], ["ext", "h", "y"], ["ext", "b", "y"], ["int", "g", "x"], ["int", "d", "x"], ["int", "h", "y"], ["int", "b", "y"]];
  const dessiner = () => {
    ctx.drawImage(canvas, 0, 0);
    ctx.fillStyle = "rgba(0,0,0,.35)";
    const e = m.ext; ctx.fillRect(0, 0, toile.width, e.h); ctx.fillRect(0, e.b, toile.width, toile.height - e.b); ctx.fillRect(0, e.h, e.g, e.b - e.h); ctx.fillRect(e.d, e.h, toile.width - e.d, e.b - e.h);
    const ep = Math.max(2, toile.width / 260);
    lignes.forEach(([k, c, axe]) => {
      ctx.strokeStyle = k === "ext" ? "#f5b524" : "#3b78ff"; ctx.lineWidth = ep; ctx.setLineDash(k === "int" ? [ep * 4, ep * 2.5] : []);
      ctx.beginPath(); const v = m[k][c];
      if (axe === "x") { ctx.moveTo(v, 0); ctx.lineTo(v, toile.height); } else { ctx.moveTo(0, v); ctx.lineTo(toile.width, v); }
      ctx.stroke();
    });
    ctx.setLineDash([]);
    majMesures();
  };
  const majMesures = () => {
    const r = ratios(m), rec = S.face === "recto" ? r : (S.mesures.recto ? ratios(S.mesures.recto) : null), ver = S.face === "verso" ? r : (S.mesures.verso ? ratios(S.mesures.verso) : null);
    $("#mesures").innerHTML = `
      <div class="mesure"><span>Gauche / droite</span><b>${r.lr?.txt || "—"}</b><small>${r.px.gl} px · ${r.px.dr} px</small></div>
      <div class="mesure"><span>Haut / bas</span><b>${r.hb?.txt || "—"}</b><small>${r.px.ht} px · ${r.px.bs} px</small></div>`;
    const n = noteCentrage(rec, ver);
    $("#note-centrage").innerHTML = `<div class="badge">${n}</div><div><b>Centrage compatible PSA ${n}</b><p>${ver ? "Recto et verso mesurés." : S.face === "recto" ? "Recto seul : le verso peut abaisser la note." : ""} Les coins, bords et surface se vérifient à l’étape suivante.</p></div>`;
  };
  dessiner();
  // Déplacement des lignes
  let prise = null;
  const coords = ev => { const r = toile.getBoundingClientRect(), p = ev.touches ? ev.touches[0] : ev; return { x: (p.clientX - r.left) / r.width * toile.width, y: (p.clientY - r.top) / r.height * toile.height, ech: toile.width / r.width, cx: p.clientX - r.left, cy: p.clientY - r.top, rw: r.width }; };
  const debut = ev => {
    const p = coords(ev), seuil = 22 * p.ech;
    let mieux = null, dist = seuil;
    lignes.forEach(l => { const v = m[l[0]][l[1]], dd = Math.abs((l[2] === "x" ? p.x : p.y) - v); if (dd < dist) { dist = dd; mieux = l; } });
    if (!mieux) return;
    prise = mieux; ev.preventDefault(); bouger(ev);
  };
  const bouger = ev => {
    if (!prise) return; ev.preventDefault();
    const p = coords(ev), [k, c, axe] = prise;
    m[k][c] = Math.round(Math.max(0, Math.min(axe === "x" ? toile.width - 1 : toile.height - 1, axe === "x" ? p.x : p.y)));
    dessiner();
    // Loupe ×4 autour du doigt, décalée pour rester visible
    loupe.hidden = false;
    const z = 4, taille = 236 / z;
    lctx.imageSmoothingEnabled = false;
    lctx.drawImage(toile, p.x - taille / 2, p.y - taille / 2, taille, taille, 0, 0, 236, 236);
    lctx.strokeStyle = "rgba(255,255,255,.7)"; lctx.lineWidth = 1; lctx.beginPath(); lctx.moveTo(118, 0); lctx.lineTo(118, 236); lctx.moveTo(0, 118); lctx.lineTo(236, 118); lctx.stroke();
    loupe.style.left = Math.min(p.rw - 124, Math.max(6, p.cx - 59)) + "px";
    loupe.style.top = Math.max(6, p.cy - 150) + "px";
  };
  const fin = () => { prise = null; loupe.hidden = true; };
  ed.addEventListener("pointerdown", e => { ed.setPointerCapture(e.pointerId); debut(e); });
  ed.addEventListener("pointermove", bouger);
  ed.addEventListener("pointerup", fin); ed.addEventListener("pointercancel", fin);
  $("#b-reprendre").onclick = () => { delete S.photos[S.face]; delete S.mesures[S.face]; S.etape = "camera"; vueScan(); };
  const r2 = $("#b-reprendre2"); if (r2) r2.onclick = $("#b-reprendre").onclick;
  const bv = $("#b-verso"); if (bv) bv.onclick = () => { S.face = "verso"; S.etape = "camera"; vueScan(); };
  $("#b-suite").onclick = () => { S.etape = "controle"; vueScan(); };
}

/* Étape 3 : contrôle guidé (coins, bords, surface) et note estimée */
function scanControle(entete) {
  const S = Scan;
  const photo = S.photos.recto;
  $("#vue").innerHTML = `${entete}
  <div class="titre-section" style="margin-top:0"><h2>État de la carte</h2><span class="petit">sous une bonne lumière, carte inclinée</span></div>
  <div class="grille deux">
    <div class="carte-ui controle" id="controle">${CRITERES.map(([k, n, aide]) => `
      <div class="critere"><span>${n} <small>· ${aide}</small></span><div class="niveaux" data-crit="${k}">${NIVEAUX.map(([lbl, v]) => `<button type="button" data-v="${v}" aria-pressed="${S.controle[k] === v}">${lbl}</button>`).join("")}</div></div>`).join("")}
    </div>
    <div class="grille" style="align-content:start">
      ${photo ? `<div class="carte-ui" style="padding:10px"><canvas id="apercu" style="width:100%;border-radius:10px;display:block"></canvas><p class="source" style="text-align:center;margin:6px 0 0">Touche un coin de l’image pour l’agrandir.</p></div>` : ""}
      <div class="note-estimee" id="note-finale"></div>
      <button class="btn principal" id="b-identifier">Identifier la carte</button>
    </div>
  </div>`;
  $$("[data-crit]").forEach(z => $$("button", z).forEach(b => b.onclick = () => { S.controle[z.dataset.crit] = +b.dataset.v; $$("button", z).forEach(x => x.setAttribute("aria-pressed", x === b)); majNote(); }));
  if (photo) {
    const ap = $("#apercu"), m = S.mesures.recto.ext, w = m.d - m.g, h = m.b - m.h;
    ap.width = w; ap.height = h; ap.getContext("2d").drawImage(photo, m.g, m.h, w, h, 0, 0, w, h);
    let zoom = null;
    ap.onclick = ev => {
      const r = ap.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width, y = (ev.clientY - r.top) / r.height, c = ap.getContext("2d");
      if (zoom) { zoom = null; c.drawImage(photo, m.g, m.h, w, h, 0, 0, w, h); return; }
      zoom = 1; const t = .32, sx = m.g + Math.max(0, Math.min(1 - t, x - t / 2)) * w, sy = m.h + Math.max(0, Math.min(1 - t, y - t / 2)) * h;
      c.drawImage(photo, sx, sy, w * t, h * t, 0, 0, w, h);
    };
  }
  const majNote = () => {
    const rec = S.mesures.recto ? ratios(S.mesures.recto) : null, ver = S.mesures.verso ? ratios(S.mesures.verso) : null;
    const nc = rec ? noteCentrage(rec, ver) : null;
    const notes = [nc, ...CRITERES.map(([k]) => S.controle[k])].filter(v => v != null);
    const manque = CRITERES.filter(([k]) => S.controle[k] == null).length;
    if (!notes.length) { $("#note-finale").innerHTML = `<div class="badge">?</div><div><b>Note estimée</b><p>Évalue chaque critère.</p></div>`; S.note = null; return; }
    const n = Math.min(...notes), haut = Math.min(10, n + (notes.filter(v => v === n).length === 1 && n < 10 ? 1 : 0));
    const etat = n >= 9 ? "NM" : n >= 7 ? "EX" : n >= 6 ? "GD" : n >= 5 ? "LP" : n >= 3 ? "PL" : "PO";
    S.note = { n, haut, etat, nc };
    $("#note-finale").innerHTML = `<div class="badge">${n}${haut > n ? "–" + haut : ""}</div><div><b>Estimation PSA ${n}${haut > n ? " à " + haut : ""} · état ${etat}</b><p>${nc != null ? `Centrage ${nc}. ` : ""}${CRITERES.filter(([k]) => S.controle[k] != null).map(([k, l]) => `${l} ${S.controle[k]}`).join(", ")}${manque ? ` · ${manque} critère${manque > 1 ? "s" : ""} à évaluer` : ""}. Indicatif : seule une gradation officielle fait foi.</p></div>`;
  };
  majNote();
  $("#b-identifier").onclick = () => { S.etape = "carte"; vueScan(); };
}

/* Étape 4 : lecture du numéro imprimé (OCR) puis choix de la carte */
async function scanCarte(entete) {
  const S = Scan;
  $("#vue").innerHTML = `${entete}
  <div class="titre-section" style="margin-top:0"><h2>Quelle carte ?</h2><button class="btn discret" id="b-recommencer">Nouveau scan</button></div>
  <div class="carte-ui" id="lecture"><span class="chargement"></span> Lecture du numéro imprimé en bas de la carte…</div>
  <div id="candidats" style="margin-top:14px"></div>
  <div class="titre-section"><h2 style="font-size:17px">Pas la bonne ? Cherche-la</h2></div>
  <div class="recherche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="sq" type="search" placeholder="Nom, numéro 25/102…"></div>
  <div id="sres" style="margin-top:12px"></div>`;
  $("#b-recommencer").onclick = recommencerScan;
  const choisir = (lang, id) => choisirCarteScan(lang, id);
  let minut;
  $("#sq").oninput = e => { clearTimeout(minut); minut = setTimeout(async () => {
    const q = e.target.value; if (!q.trim()) { $("#sres").innerHTML = ""; return; }
    await Promise.all(["fr", "en", "ja"].map(l => chargerIndex(l).catch(() => null)));
    afficherCandidats($("#sres"), rechercher(q, ["fr", "en", "ja"], 24).res.map(x => x.c), choisir);
  }, 200); };
  const lecture = $("#lecture");
  if (!S.photos.recto) { lecture.textContent = "Pas de photo du recto : cherche la carte ci-dessous."; return; }
  try {
    const [res] = await Promise.all([lireNumero(S.photos.recto, S.mesures.recto.ext), ...["fr", "en", "ja"].map(l => chargerIndex(l).catch(() => null))]);
    if (ETAT.vue !== "scan" || S.etape !== "carte") return;
    if (!res) { lecture.innerHTML = "Numéro illisible sur la photo. Cherche la carte par son nom ci-dessous."; $("#sq").focus(); return; }
    const cands = [];
    for (const l of ["fr", "en", "ja"]) {
      const ix = INDEX[l]; if (!ix) continue;
      ix.cartes.forEach(c => { const set = ix.sets[c.set]; if (c.num === res.num && set && (set.off === res.denom || set.tot === res.denom)) cands.push(c); });
    }
    lecture.innerHTML = `Numéro lu : <b class="chiffre">${res.num}/${res.denom}</b> · ${cands.length ? `${cands.length} carte${cands.length > 1 ? "s" : ""} possible${cands.length > 1 ? "s" : ""}, choisis la tienne (et sa langue).` : "aucune carte avec ce numéro, cherche-la ci-dessous."}`;
    afficherCandidats($("#candidats"), cands, choisir);
    if (!cands.length) $("#sq").value = `${res.num}/${res.denom}`, $("#sq").dispatchEvent(new Event("input"));
  } catch (e) {
    console.error(e);
    lecture.innerHTML = "La lecture automatique n’a pas fonctionné. Cherche la carte ci-dessous.";
  }
}
function afficherCandidats(zone, cartes, surChoix) {
  if (!cartes.length) { zone.innerHTML = ""; return; }
  zone.innerHTML = `<div class="candidats">${cartes.map(c => { const set = INDEX[c.lang]?.sets[c.set]; return `<button class="tuile" data-c="${esc(c.id)}" data-l="${c.lang}"><span class="img">${visuel({ lang: c.lang, id: c.id, image: c.img, nom: c.nom, meta: `${set?.nom || c.set} · ${c.local}` })}<span class="marques"><span class="puce ${c.lang}">${COURT[c.lang]}</span></span></span><span class="t-nom">${esc(c.nom)}</span>${nomFr(c) ? `<span class="t-fr">${esc(nomFr(c))}</span>` : ""}<span class="t-meta">${esc(set?.nom || c.set)} · ${esc(c.local)}</span></button>`; }).join("")}</div>`;
  $$("[data-c]", zone).forEach(b => b.onclick = () => surChoix(b.dataset.l, b.dataset.c));
}
async function choisirCarteScan(lang, id) {
  const S = Scan;
  try {
    const carte = await api(lang, "cards/" + id);
    const rec = S.mesures.recto ? ratios(S.mesures.recto) : null, ver = S.mesures.verso ? ratios(S.mesures.verso) : null;
    const centrage = rec ? { recto: { lr: rec.lr?.txt, hb: rec.hb?.txt }, ...(ver ? { verso: { lr: ver.lr?.txt, hb: ver.hb?.txt } } : {}) } : null;
    const note = S.note;
    formulaireCarte({ carte, lang, scan: { etat: note?.etat || "NM", centrage, controle: Object.keys(S.controle).length ? S.controle : null, note_estimee: note ? `PSA ${note.n}${note.haut > note.n ? "–" + note.haut : ""} estimé` : null } });
  } catch (e) { erreur(e, "Carte"); }
}

/* OCR du numéro « 025/165 » en bas de la carte, avec Tesseract (chargé seulement au premier scan). */
let tesseractPret = null;
function chargerTesseract() {
  if (window.Tesseract) return Promise.resolve();
  return tesseractPret ||= new Promise((ok, ko) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"; s.onload = ok; s.onerror = () => { tesseractPret = null; ko(new Error("Lecteur de texte indisponible")); }; document.head.append(s); });
}
async function lireNumero(photo, ext) {
  await chargerTesseract();
  const w = ext.d - ext.g, h = ext.b - ext.h;
  const zones = [[0, .86, .55, .14], [.45, .86, .55, .14], [0, .9, 1, .1]]; // bas gauche (cartes récentes), bas droite (anciennes), bande entière
  const worker = await Tesseract.createWorker("eng");
  try {
    await worker.setParameters({ tessedit_char_whitelist: "0123456789/", tessedit_pageseg_mode: "11" });
    for (const [zx, zy, zw, zh] of zones) {
      const c = document.createElement("canvas"), sw = w * zw, shh = h * zh, ech = Math.max(2, 900 / sw);
      c.width = Math.round(sw * ech); c.height = Math.round(shh * ech);
      const x = c.getContext("2d", { willReadFrequently: true });
      x.imageSmoothingQuality = "high";
      x.drawImage(photo, ext.g + w * zx, ext.h + h * zy, sw, shh, 0, 0, c.width, c.height);
      // Niveaux de gris et contraste étiré : texte noir, fond clair
      const im = x.getImageData(0, 0, c.width, c.height), d = im.data; let mn = 255, mx = 0;
      for (let i = 0; i < d.length; i += 4) { const v = d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11; d[i] = v; if (v < mn) mn = v; if (v > mx) mx = v; }
      const sombre = (() => { let s = 0; for (let i = 0; i < d.length; i += 4) s += d[i]; return s / (d.length / 4) < 110; })();
      for (let i = 0; i < d.length; i += 4) { let v = (d[i] - mn) / Math.max(1, mx - mn) * 255; if (sombre) v = 255 - v; d[i] = d[i + 1] = d[i + 2] = v; }
      x.putImageData(im, 0, 0);
      const { data } = await worker.recognize(c);
      const m = (data.text || "").replace(/\s+/g, " ").match(/(\d{1,3})\s?\/\s?(\d{2,3})/);
      if (m) { const n = parseInt(m[1], 10), dn = parseInt(m[2], 10); if (n > 0 && dn > 0 && n <= dn + 150) return { num: n, denom: dn }; }
    }
    return null;
  } finally { worker.terminate(); }
}

/* ═══════════ Démarrage ═══════════ */
async function demarrer(session) {
  const uid = session?.user?.id || null;
  if (demarrer.uid === uid && demarrer.fait) return;
  demarrer.uid = uid; demarrer.fait = true;
  ETAT.session = session;
  if (!session) { ETAT.charge = false; vueConnexion(); return; }
  $("#nav").hidden = false; $("#tete-actions").hidden = false;
  if (!ETAT.charge) {
    $("#vue").innerHTML = `<div class="vide"><span class="chargement"></span></div>`;
    try { await chargerDonnees(); } catch (e) { erreur(e, "Chargement"); }
  }
  routeur();
  rafraichirCotesAnciennes().catch(() => {});
  // Prépare l'index de recherche en arrière-plan
  setTimeout(() => ["fr", "en", "ja"].forEach(l => chargerIndex(l).catch(() => {})), 1500);
}
sb.auth.onAuthStateChange((evt, session) => {
  if (evt === "SIGNED_IN") demarrer(session);
  else if (evt === "SIGNED_OUT") { ETAT.cartes = []; ETAT.suivis = []; ETAT.valeurs = []; demarrer(null); }
  else if (session) ETAT.session = session;
});
sb.auth.getSession().then(({ data }) => demarrer(data.session));
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
